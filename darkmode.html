<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Dark Mode</title>

<style>
body{
    background:white;
    color:black;
    font-family:tahoma;
    text-align:center;
    transition:0.5s;
}

.dark{
    background:#111;
    color:white;
}

button{
    margin-top:100px;
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
</style>

</head>
<body>

<h1>حالت سایت</h1>

<button onclick="changeMode()">تغییر حالت</button>

<script>
function changeMode(){
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
