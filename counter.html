<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شمارنده کلیک</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Tahoma;
            background: #111;
            color: white;
        }

        .box {
            background: #1f1f1f;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 300px;
        }

        h1 {
            margin-bottom: 20px;
        }

        #count {
            font-size: 50px;
            color: #00aaff;
            margin: 20px 0;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
        }

        .add {
            background: #00aaff;
            color: white;
        }

        .reset {
            background: #ff4444;
            color: white;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>شمارنده کلیک</h1>
        <div id="count">0</div>
        <button class="add" onclick="addCount()">کلیک کن</button>
        <button class="reset" onclick="resetCount()">ریست</button>
    </div>

    <script>
        let count = 0;

        function addCount() {
            count++;
            document.getElementById("count").textContent = count;
        }

        function resetCount() {
            count = 0;
            document.getElementById("count").textContent = count;
        }
    </script>

</body>
</html>
